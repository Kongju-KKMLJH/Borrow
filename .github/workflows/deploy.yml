name: Deploy

# main 에 머지되면 이미지·웹 번들을 만들고, 스위치가 켜져 있으면 서버에 배포한다.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  # 배포 도중 취소되면 반쯤 배포된 상태가 남는다. 취소하지 않는다.
  cancel-in-progress: false

permissions:
  contents: read
  packages: write        # GHCR 푸시

env:
  # GHCR 은 소문자만 허용한다 (조직명이 Kongju-KKMLJH 여도 경로는 소문자).
  IMAGE: ghcr.io/kongju-kkmljh/borrow-backend

jobs:
  # ---------- 1) 품질 게이트 ----------
  test:
    name: 백엔드 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test

  # ---------- 2) 백엔드 이미지 ----------
  backend-image:
    name: 백엔드 이미지 빌드·푸시
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # 워크플로에 자동 제공된다 — 별도 시크릿 등록이 필요 없다.
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}   # 롤백용 불변 태그
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- 3) 프론트 웹 번들 ----------
  frontend-web:
    name: 프론트 웹 번들 빌드
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # EXPO_PUBLIC_API_URL 을 설정하지 않는다 — 프론트·API 가 같은 오리진이므로
      # 상대경로(/api/...)로 호출되어야 한다.
      - run: npx expo export --platform web
      - run: tar czf ../web-dist.tgz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist-tgz
          path: web-dist.tgz
          retention-days: 3

  # ---------- 4) 서버 배포 ----------
  deploy:
    name: 서버 배포
    needs: [backend-image, frontend-web]
    # ★ 서버 준비 전에는 이 job 이 통째로 skip 된다 (main push 마다 빨간 X 가 뜨지 않게).
    #   배포일에 Settings → Variables 에서 DEPLOY_ENABLED=true 를 추가하면 켜진다.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist-tgz

      - name: 배포 설정·웹 번들 업로드
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy/docker-compose.prod.yml,deploy/Caddyfile,web-dist.tgz"
          target: "/opt/borrow/incoming"

      - name: 배포 실행 (실패 시 자동 롤백)
        uses: appleboy/ssh-action@v1.2.0
        env:
          NEW_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: NEW_TAG
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/borrow
            COMPOSE="docker compose --env-file .env --env-file .env.image -f docker-compose.prod.yml"

            # 0) 배포 전 DB 백업 — 되돌릴 수 있게
            mkdir -p backups
            docker exec borrow-mysql sh -c \
              'exec mysqldump -uroot -p"$MYSQL_ROOT_PASSWORD" --single-transaction borrow' \
              | gzip > "backups/predeploy-$(date +%F-%H%M%S).sql.gz" \
              || echo "첫 배포라 백업을 건너뛴다"

            # 1) 설정 파일 갱신
            cp incoming/deploy/docker-compose.prod.yml ./docker-compose.prod.yml
            cp incoming/deploy/Caddyfile ./Caddyfile

            # 2) 웹 번들 원자적 교체 (반쯤 풀린 상태가 노출되지 않게)
            rm -rf web.new && mkdir -p web.new
            tar xzf incoming/web-dist.tgz -C web.new
            rm -rf web.old; [ -d web ] && mv web web.old || true
            mv web.new web

            # 3) 이미지 태그 롤백 포인터
            [ -f .env.image ] && cp .env.image .env.image.prev || true
            echo "BACKEND_TAG=${NEW_TAG}" > .env.image

            # 4) 기동
            $COMPOSE pull
            $COMPOSE up -d --remove-orphans

            # 5) 헬스체크 (actuator 가 없으므로 공개 GET 사용)
            ok=0
            for i in $(seq 1 40); do
              if curl -fsS -o /dev/null http://127.0.0.1/api/activities; then ok=1; break; fi
              sleep 3
            done

            # 6) 실패하면 이전 상태로 되돌린다
            if [ "$ok" != "1" ]; then
              echo "::error::헬스체크 실패 — 롤백합니다"
              $COMPOSE logs --tail=200 app || true
              if [ -f .env.image.prev ]; then
                cp .env.image.prev .env.image
                $COMPOSE up -d
              fi
              rm -rf web; [ -d web.old ] && mv web.old web || true
              exit 1
            fi

            docker image prune -f
            rm -rf incoming
            echo "배포 완료: ${NEW_TAG}"
