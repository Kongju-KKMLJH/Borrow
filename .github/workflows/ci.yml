name: CI

on:
  pull_request:
    branches: [main, dev, backend, 'yonggyu/backend', 'kang/backend', front]
  push:
    branches: [main, dev, backend]
  workflow_dispatch:

# 같은 브랜치에 연속 푸시하면 이전 실행을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (compile + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 설치 (build.gradle toolchain 기준)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 배포판·의존성 캐시와 데몬 수명을 액션이 관리한다.
      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: compileJava (커밋 전 필수 빌드 확인)
        run: ./gradlew compileJava

      # 테스트는 DB·도커 없이 돈다 — 컨텍스트가 필요한 테스트는 인메모리 H2를
      # 애노테이션 안에서 직접 지정한다(application.yml은 커밋되지 않음).
      - name: test (PR 전 필수 품질 게이트)
        run: ./gradlew test

      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7

  frontend:
    name: frontend (typecheck + lint + web build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Node 20 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치 (락파일 고정)
        run: npm ci

      - name: 타입 체크 (tsconfig strict)
        run: npx tsc --noEmit

      - name: 린트
        run: npx expo lint

      # ★ 이 스텝이 핵심 — 웹 번들이 실제로 만들어지는지가 배포 가능 여부다.
      #   datetimepicker 처럼 웹 엔트리가 없는 네이티브 모듈을 여기서 잡는다.
      - name: 웹 번들 빌드 검증
        run: npx expo export --platform web

      - name: 웹 번들 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/dist
          retention-days: 7
